<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicao</title>
</head>
<body>
       <h1> O numero é: {{numero}}</h1>
<body>

{# % retorna o resto, 5 % 2 retorna 1 #}

{% if numero == 0 %}
    <p>O número enviado é ZERO!</p>

{% elif (numero % 2) == 0 %}
    <p>O número enviado é PAR.</p>

{% else %}
    <p>O número enviado é ÍMPAR.</p>

{% endif %}

<!--Usamos o for sempre que precisamos repetir ate uma condição -->



{% for i in range(numero, -1, -1) %}
    <li>{{i}}</li>

{%endfor%}

</ul>
</body>
</html>
