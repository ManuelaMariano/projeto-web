<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Calculadora</h1>

    <!-- ACTION => Para onde os dados vão
     METHOD => Como eles vão -->
    
    <form action="" method="POST">
        <label for="nome"> Digite seu nome:</label>
        <input type="text" name="nome" id=" nome">
    <br><br>
        <label for="numero1"> Digite o primeiro numero:</label>
        <input type="number" name="numero1" id=" numero1">
    <br><br>
        <label for="numero2"> Digite o segundo numero:</label>
        <input type="number" step="0.01" name="numero2" id=" numero2">
    <br><br>
    
        <!-- step é numero com virgula -->
    
    
    
    <button type="submit">CALCULAR</button>
    
    </form>


</body>
</html>
